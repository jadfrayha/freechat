<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot or Faker — Real AI or human faking it?</title>
<meta name="description" content="A free online game: chat with a subject that claims to be an AI and guess — real AI, or a human faking it? Or put on the mask and fool the detective. English and Arabic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Inter:wght@400;500;600;700&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f3ec,#0f0f10);--ink:light-dark(#141414,#f5f1e8);--mut:light-dark(#66635b,#aaa59a);--card:light-dark(#ffffff,#1a1a1c);--line:light-dark(#e2ddd0,#2f2e31);--red:light-dark(#e0352b,#ff6158);--steel:light-dark(#2456a6,#7db4ff);--wash:light-dark(#e9eff9,#1d2536);--sand:light-dark(#f1e7cf,#2a2418);--body:Inter,system-ui,sans-serif;--head:"Big Shoulders Display",Impact,sans-serif}
html[lang=ar]{--body:Cairo,Inter,system-ui,sans-serif;--head:Cairo,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);overflow-x:clip;background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:24px 24px}
[hidden]{display:none!important}
.band{padding:clamp(20px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,.big{font-family:var(--head);font-weight:800;line-height:1.02;margin:0;text-wrap:balance}
.top{background:#141414;color:#f5f1e8;padding-block:18px;border-bottom:4px solid var(--red)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px}
.top h1{font-size:clamp(34px,5vw,52px);letter-spacing:-.01em}
.top h1 span{color:var(--red)}
.tag{margin:2px 0 0;opacity:.75;font-size:15px}
.tr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:13px;padding:7px 14px;border:1px solid #444;border-radius:99px;background:#1f1f1f}
.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ccf6e;margin-inline-end:8px;box-shadow:0 0 0 0 #3ccf6e;animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(60,207,110,.7)}70%,100%{box-shadow:0 0 0 9px rgba(60,207,110,0)}}
.lang{font:600 14px var(--body);min-height:40px;padding:0 16px;border-radius:99px;border:1px solid #555;background:transparent;color:#f5f1e8;cursor:pointer}
.hero{padding-bottom:0}
.hero-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.kicker{display:inline-block;font:700 13px var(--body);color:var(--red);background:var(--sand);padding:6px 12px;border-radius:99px;margin:0 0 14px}
.mega{font-size:clamp(56px,9vw,112px);color:var(--ink);letter-spacing:-.02em}
.mega em{font-style:normal;color:var(--red)}
.lead{font-size:clamp(16px,2vw,19px);color:var(--mut);max-width:34em;margin:14px 0 0}
.face{position:relative;aspect-ratio:1;max-width:340px;justify-self:center;width:100%}
.face .blob{position:absolute;inset:6%;border-radius:46% 54% 48% 52%/52% 44% 56% 48%;background:var(--steel);animation:morph 7s ease-in-out infinite;overflow:hidden}
.face .blob::after{content:"";position:absolute;inset:0;background:var(--red);clip-path:polygon(50% 0,100% 0,100% 100%,50% 100%);opacity:.9}
.face .eye{position:absolute;top:38%;width:17%;height:19%;background:#fff;border-radius:50%;border:5px solid #141414;animation:blink 4s infinite;z-index:2}
.face .eye.l{left:24%}.face .eye.r{right:24%}
.face .mouth{position:absolute;left:34%;right:34%;top:68%;height:8%;background:#141414;border-radius:99px;z-index:2;animation:talk 2.4s ease-in-out infinite;transform-origin:center}
@keyframes morph{0%,100%{border-radius:46% 54% 48% 52%/52% 44% 56% 48%}50%{border-radius:58% 42% 52% 48%/44% 56% 44% 56%}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes talk{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.6)}}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:34px}
.role{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.role:hover{transform:translate(-2px,-3px);box-shadow:9px 9px 0 var(--ink)}
.role svg{width:100%;height:190px;border-radius:14px;display:block;border:2px solid var(--ink)}
.det svg{background:var(--wash)}.act svg{background:var(--sand)}
.det{border-top:10px solid var(--steel)}.act{border-top:10px solid var(--red)}
h2{font-size:44px}
.role p{margin:0;color:var(--mut)}
.btn{font:700 16px var(--body);min-height:50px;padding:0 22px;border-radius:14px;border:2px solid var(--ink);cursor:pointer;background:var(--ink);color:var(--bg);box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff;border-color:var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn:focus-visible,input:focus-visible,.lang:focus-visible,.sug:focus-visible{outline:3px solid var(--steel);outline-offset:3px}
.role .btn{margin-top:auto;align-self:flex-start}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:30px}
.how>div{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:14px 16px}
.how b{display:block;font-family:var(--head);font-size:24px;line-height:1.1}
.how span{color:var(--mut);font-size:15px}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;max-width:1180px;margin:0 auto}
.chat{background:var(--card);border:2px solid var(--ink);border-radius:22px;display:flex;flex-direction:column;height:min(660px,calc(100vh - 150px));min-height:440px;overflow:hidden;box-shadow:6px 6px 0 var(--ink)}
.chead{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-bottom:2px solid var(--ink);background:var(--sand)}
.chead b{white-space:nowrap;font-family:var(--head);font-size:24px;line-height:1}
.chead small{color:var(--red);flex:1;font-weight:600}
.chead .btn{min-height:40px;padding:0 14px;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:18px 18px}
.m{max-width:78%;padding:11px 15px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;border:2px solid var(--ink);animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.them{background:var(--card);border-end-start-radius:4px;align-self:flex-start;box-shadow:3px 3px 0 var(--ink)}
.me{background:var(--red);color:#fff;border-end-end-radius:4px;align-self:flex-end;box-shadow:3px 3px 0 var(--ink)}
.sys{align-self:center;background:var(--sand);border:none;border-radius:99px;color:var(--ink);font-size:13px;text-align:center;max-width:90%;padding:6px 14px;animation:none}
form{display:flex;gap:10px;padding:12px;border-top:2px solid var(--ink);background:var(--card)}
input{flex:1;font:16px var(--body);min-height:50px;padding:0 16px;border-radius:14px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);unicode-bidi:plaintext}
.side{display:flex;flex-direction:column;gap:16px}
.box{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;box-shadow:5px 5px 0 var(--ink)}
.box h3{margin:0 0 10px;font-family:var(--head);font-size:26px;line-height:1.05}
.lbl{color:var(--mut);font-size:14px}
.v{width:100%;margin-bottom:10px}
.v[data-v=ai]{background:var(--steel);color:#fff}
.tips{margin:0;padding-inline-start:18px;color:var(--mut);font-size:15px}
.sug{display:block;width:100%;text-align:start;font:14px/1.4 var(--body);min-height:46px;padding:10px 13px;margin-bottom:9px;border-radius:14px;border:2px solid var(--ink);background:var(--wash);color:var(--ink);cursor:pointer;unicode-bidi:plaintext;transition:transform .1s}
.sug:hover{transform:translateX(3px);border-color:var(--red)}
.waitc{max-width:560px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.radar{width:130px;height:130px;border-radius:50%;border:4px solid var(--red);position:relative;margin:10px 0;background:var(--sand)}
.radar::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--red);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{to{transform:scale(1.6);opacity:0}}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ov{position:fixed;inset:0;background:rgba(20,20,20,.6);display:grid;place-items:center;padding:16px;z-index:9}
.ov .box{max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:28px}
.ov h2{font-size:clamp(56px,11vw,84px);color:var(--red);transform:rotate(-6deg);border:6px solid var(--red);border-radius:14px;padding:4px 18px;animation:stamp .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(1.7);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.ov p{margin:0}
.friend{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:center;margin-top:26px;background:var(--steel);color:#fff;border:2px solid var(--ink);border-radius:22px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
.friend h2{font-size:40px}.friend p{margin:6px 0 0;opacity:.9}
.fctl{display:flex;flex-direction:column;gap:12px}.fctl .lbl{color:#fff;min-height:1em;margin:0}
.joinf{display:flex;gap:10px;padding:0;border:0;background:none}
.joinf input{text-transform:uppercase;letter-spacing:.3em;font-weight:800;text-align:center;max-width:150px}
.codebig{font-family:var(--head);font-size:clamp(72px,16vw,128px);letter-spacing:.12em;line-height:1;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px 26px;box-shadow:6px 6px 0 var(--ink)}
@media(max-width:760px){.friend{grid-template-columns:minmax(0,1fr)}}
.foot{color:var(--mut);font-size:14px;text-align:center;padding-top:0}
.off{background:var(--red);color:#fff;text-align:center;font-size:14px;padding:8px 16px;font-weight:600}
@media(max-width:760px){.hero-in,.roles,.how{grid-template-columns:minmax(0,1fr)}.face{max-width:200px;order:-1}.gwrap{grid-template-columns:minmax(0,1fr)}.side{order:-1}.chat{height:66vh}.m{max-width:88%}#actPanel .tipsWrap{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="off" id="off" hidden data-t="offline"></div>
<header class="top band"><div class="wrap">
  <div><h1 data-t="title"></h1><p class="tag" data-t="tag"></p></div>
  <div class="tr"><span class="pill"><i></i><span id="online"></span></span><button class="lang" id="lang"></button></div>
</div></header>

<section class="hero band"><div class="wrap hero-in">
  <div>
    <span class="kicker" data-t="kicker"></span>
    <h2 class="mega" data-t="heroH"></h2>
    <p class="lead" data-t="lead"></p>
  </div>
  <div class="face" aria-hidden="true"><div class="blob"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div></div>
</div></section>
<main>
<section id="lobby" class="band"><div class="wrap">
  <div class="roles">
    <article class="role det">
      <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <ellipse cx="200" cy="182" rx="120" ry="10" fill="#000" opacity=".08"/>
        <rect x="150" y="50" width="110" height="100" rx="22" fill="#2d5b88"/>
        <rect x="150" y="50" width="110" height="18" rx="9" fill="#fff" opacity=".18"/>
        <line x1="205" y1="50" x2="205" y2="28" stroke="#2d5b88" stroke-width="6"/><circle cx="205" cy="24" r="8" fill="#d92f25"/>
        <circle cx="182" cy="95" r="11" fill="#fff"/><circle cx="228" cy="95" r="11" fill="#fff"/>
        <rect x="178" y="122" width="54" height="8" rx="4" fill="#fff" opacity=".8"/>
        <circle cx="250" cy="108" r="44" fill="#fff" fill-opacity=".25" stroke="#d92f25" stroke-width="10"/>
        <line x1="282" y1="140" x2="322" y2="176" stroke="#151515" stroke-width="16" stroke-linecap="round"/>
      </svg>
      <h2 data-t="detH"></h2><p data-t="detP"></p>
      <button class="btn" id="goDet" data-t="detB"></button>
    </article>
    <article class="role act">
      <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <ellipse cx="200" cy="186" rx="120" ry="10" fill="#000" opacity=".08"/>
        <path d="M120 200c0-50 36-78 80-78s80 28 80 78z" fill="#151515"/>
        <circle cx="200" cy="82" r="46" fill="#c98b63"/>
        <path d="M156 70c6-30 30-40 50-38 22 2 36 16 40 36-18-10-58-12-90 2z" fill="#3a2a20"/>
        <line x1="270" y1="176" x2="236" y2="104" stroke="#8a5a3a" stroke-width="7" stroke-linecap="round"/>
        <rect x="150" y="54" width="96" height="70" rx="16" fill="#e8ecf0" stroke="#151515" stroke-width="4"/>
        <circle cx="178" cy="86" r="9" fill="#d92f25"/><circle cx="218" cy="86" r="9" fill="#d92f25"/>
        <rect x="178" y="104" width="40" height="6" rx="3" fill="#151515"/>
      </svg>
      <h2 data-t="actH"></h2><p data-t="actP"></p>
      <button class="btn red" id="goAct" data-t="actB"></button>
    </article>
  </div>
  <div class="friend">
    <div><h2 data-t="roomH"></h2><p data-t="roomP"></p></div>
    <div class="fctl">
      <button class="btn red" id="mkRoom" data-t="roomNew"></button>
      <form id="joinF" class="joinf"><input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" aria-label="Room code"><button class="btn" data-t="roomJoin"></button></form>
      <p class="lbl" id="roomErr" role="alert"></p>
    </div>
  </div>
  <div class="how">
    <div><b data-t="h1b"></b><span data-t="h1"></span></div>
    <div><b data-t="h2b"></b><span data-t="h2"></span></div>
    <div><b data-t="h3b"></b><span data-t="h3"></span></div>
  </div>
</div></section>

<section id="roomwait" class="band" hidden><div class="waitc">
  <h2 data-t="roomWaitH"></h2>
  <div class="codebig" id="codeBig"></div>
  <p class="lbl" data-t="roomWaitP"></p>
  <div class="row"><button class="btn red" id="copyLink" data-t="copy"></button><button class="btn ghost" id="roomBack" data-t="back"></button></div>
  <p class="lbl" id="linkTxt" style="overflow-wrap:anywhere"></p>
</div></section>

<section id="wait" class="band" hidden><div class="waitc">
  <div class="radar"></div>
  <h2 data-t="waitH"></h2>
  <p class="lbl" id="waitCount"></p>
  <div class="row"><button class="btn red" id="practice" data-t="practice"></button><button class="btn ghost" id="waitBack" data-t="back"></button></div>
</div></section>

<section id="game" class="band" hidden><div class="gwrap">
  <div class="chat">
    <div class="chead"><b id="who"></b><small id="typing"></small><button class="btn ghost" id="skip" disabled></button><button class="btn ghost" id="leave" data-t="leave"></button></div>
    <div class="log" id="log" aria-live="polite"></div>
    <form id="form"><input id="msg" autocomplete="off" maxlength="600" aria-label="Message"><button class="btn" data-t="send"></button></form>
  </div>
  <aside class="side">
    <div class="box" id="detPanel">
      <h3 data-t="call"></h3>
      <button class="btn v" data-v="ai" data-t="vAi"></button>
      <button class="btn red v" data-v="human" data-t="vHu"></button>
      <div class="lbl" id="vlock" data-t="hint"></div>
    </div>
    <div class="box" id="actPanel">
      <h3 data-t="sugH"></h3>
      <div id="sugs"></div>
      <div class="tipsWrap"><h3 style="margin-top:14px" data-t="stayH"></h3><ul class="tips" id="tips"></ul></div>
    </div>
  </aside>
</div></section>
</main>

<p class="foot band" id="stats"></p>

<div class="ov" id="result" hidden><div class="box">
  <h2 id="rH"></h2><p id="rP" class="lbl"></p>
  <div class="row"><button class="btn red" id="again" data-t="again"></button><button class="btn ghost" id="toLobby" data-t="lobby"></button></div>
</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
{
const T={
en:{title:'Bot or Faker',tag:'Every subject swears it’s an AI. Some are lying. Pick a side.',detH:'I’m the Detective',detP:'Chat with a subject that claims to be an AI. Is it a real AI — or a human faking it? No time limit: chat as long as you like, then make the call.',detB:'Start interrogating',actH:'I’m the Faker',actP:'You’re human. Your job: make the detective believe you’re an AI. Wait for a live detective, or practice against the bot.',actB:'Put on the mask',h1b:'Detectives',h1:'get matched 50/50 with a real AI or a human faker.',h2b:'Fakers',h2:'score when the detective votes “Real AI”.',h3b:'Nobody online?',h3:'The bot fills in, so a round always starts.',waitH:'Waiting for a detective…',practice:'Practice with the bot',back:'Back',leave:'Leave',ph:'Type a message…',send:'Send',call:'Your call',vAi:'Real AI',vHu:'Human faking',hint:'Try trick questions, fast maths, opinions, slang.',sugH:'What an AI would say',stayH:'Stay in character',tips:['Open with “Certainly!” or “Great question!”','No typos, no slang, no feelings.','Use tidy lists and balanced answers.','Never pick a side on opinions.'],again:'Play again',lobby:'Back to lobby',subj:'Subject',detLive:'Detective · live player',detAi:'Detective · bot (practice)',sysDet:'You’re connected to a subject that says it’s an AI. Ask anything. Real bot, or human faker?',sysAct:'A detective is on the line. Act like an AI.',sysPrac:'Practice round: the bot is interrogating you. Convince it you’re an AI.',typing:'typing…',online:'{n} online · {d} detectives · {w} fakers waiting',connecting:'Connecting…',waitCount:'{d} detectives online now. Keep this page open.',correct:'Correct.',fooledYou:'Fooled you.',youSaid:'You said “{v}”. ',tAi:'It was the real bot.',tHu:'It was a real human pretending to be an AI.',tSim:'It was a human faker — played by the bot, since no live fakers were waiting.',fooled:'You fooled them.',busted:'Busted.',fooledP:'The detective voted “Real AI”. ',bustedP:'The detective saw a human behind the mask. ',left:'The other player left.',stats:'Your record — Detective: {a}/{b} correct · Faker: fooled {c}/{d}',thinking:'Thinking of AI-style lines…',langBtn:'العربية',roomH:'Play with a friend',roomP:'Make a private room and send your friend the code. Each round, the detective never knows if their friend is typing or the bot is answering for them. Roles swap every round.',roomNew:'Create a room',roomJoin:'Join',codePh:'CODE',roomWaitH:'Send this code to your friend',roomWaitP:'Or send the link. The game starts as soon as they join.',copy:'Copy link',copied:'Copied!',roomErr:'That room doesn’t exist or is full.',sysWatch:'This round the BOT answers for you. Watch: can your friend tell?',sysRoomDet:'Your friend is on the other side — or is it the bot answering for them? Find out.',watchOk:'They saw through it.',watchNo:'They were fooled!',watchP:'This round the bot answered for you. Your friend voted “{v}”.',nextRound:'Next round',waitFriend:'Waiting for your friend…',friendReady:'Your friend is ready for the next round.',roomClosed:'Your friend left the room.',roomLbl:'Room {c} · round {r}',kicker:'Live now · free · no sign-up',heroH:'Bot or <em>Faker?</em>',lead:'Two strangers. One question. Is the other side a bot, or a person pretending to be one?',skip:'Skip',skipIn:'Skip in {t}',voteLock:'Voting unlocks in {t}',offline:'Connection lost — reconnecting…'},
ar:{title:'بوت ولا مزيّف؟',tag:'كل واحد بيحلف إنو ذكاء اصطناعي. في منن عم يكذبوا. اختار دورك.',detH:'أنا المحقّق',detP:'احكي مع حدا بيقول إنو ذكاء اصطناعي. هل هو AI حقيقي، ولا إنسان عم يمثّل؟ ما في وقت محدّد: احكي قدّ ما بدّك، وبعدين قرّر.',detB:'ابدأ التحقيق',actH:'أنا المزيّف',actP:'إنت إنسان، ومهمّتك تقنع المحقّق إنك ذكاء اصطناعي. استنّى محقّق حقيقي، أو تمرّن مع البوت.',actB:'البس القناع',h1b:'المحقّقين',h1:'بيطلعلن ٥٠/٥٠: يا AI حقيقي، يا إنسان مزيّف.',h2b:'المزيّفين',h2:'بيربحوا إذا المحقّق صوّت «AI حقيقي».',h3b:'ما في حدا أونلاين؟',h3:'البوت بيعبّي المحل، فدايماً في جولة.',waitH:'عم نستنّى محقّق…',practice:'تمرّن مع البوت',back:'رجوع',leave:'اطلع',ph:'اكتب رسالة…',send:'ابعت',call:'قرارك',vAi:'AI حقيقي',vHu:'إنسان مزيّف',hint:'جرّب أسئلة مفخّخة، حساب سريع، آراء، أو لهجة.',sugH:'شو كان الـAI رح يقول',stayH:'خلّيك بالدور',tips:['ابدأ بـ«أكيد!» أو «سؤال حلو!»','لا أغلاط، لا لهجة، لا مشاعر.','جاوب بنقاط مرتّبة ومتوازنة.','ما تاخد موقف بالآراء أبداً.'],again:'العب كمان مرّة',lobby:'رجوع للبداية',subj:'المشتبه فيه',detLive:'المحقّق · لاعب حقيقي',detAi:'المحقّق · بوت (تمرين)',sysDet:'إنت عم تحكي مع حدا بيقول إنو AI. اسأل شو ما بدّك. بوت حقيقي ولا إنسان مزيّف؟',sysAct:'في محقّق عالخط. تصرّف متل الـAI.',sysPrac:'جولة تمرين: البوت عم يحقّق معك. أقنعه إنك AI.',typing:'عم يكتب…',online:'{n} أونلاين · {d} محقّقين · {w} مزيّفين عم يستنّوا',connecting:'عم نتّصل…',waitCount:'في {d} محقّقين أونلاين هلّق. خلّي الصفحة مفتوحة.',correct:'صح!',fooledYou:'انضحك عليك.',youSaid:'إنت قلت «{v}». ',tAi:'كان البوت الحقيقي.',tHu:'كان إنسان حقيقي عم يمثّل إنو AI.',tSim:'كان مزيّف، بس لعبه البوت لأنو ما كان في لاعبين عم يستنّوا.',fooled:'ضحكت عليه!',busted:'انكشفت!',fooledP:'المحقّق صوّت «AI حقيقي». ',bustedP:'المحقّق شاف الإنسان ورا القناع. ',left:'اللاعب التاني طلع.',stats:'نتيجتك — محقّق: {a}/{b} صح · مزيّف: ضحكت على {c}/{d}',thinking:'عم فكّر بجمل متل الـAI…',langBtn:'English',roomH:'العب مع صاحبك',roomP:'اعمل غرفة خاصة وابعت الكود لصاحبك. بكل جولة، المحقّق ما بيعرف إذا صاحبه عم يكتب أو البوت عم يجاوب عنه. الأدوار بتتبدّل كل جولة.',roomNew:'اعمل غرفة',roomJoin:'فوت',codePh:'الكود',roomWaitH:'ابعت هالكود لصاحبك',roomWaitP:'أو ابعتله الرابط. اللعبة بتبلّش أوّل ما يفوت.',copy:'انسخ الرابط',copied:'تنسخ!',roomErr:'هالغرفة مش موجودة أو مليانة.',sysWatch:'هالجولة البوت عم يجاوب عنك. اتفرّج: صاحبك رح يكتشف؟',sysRoomDet:'صاحبك عالطرف التاني… ولا البوت عم يجاوب عنه؟ اكتشف.',watchOk:'كشفوها!',watchNo:'انضحك عليه!',watchP:'هالجولة البوت جاوب عنك. صاحبك صوّت «{v}».',nextRound:'الجولة الجاية',waitFriend:'عم نستنّى صاحبك…',friendReady:'صاحبك جاهز للجولة الجاية.',roomClosed:'صاحبك طلع من الغرفة.',roomLbl:'غرفة {c} · جولة {r}',kicker:'مباشر الآن · مجاني · بدون تسجيل',heroH:'بوت ولا <em>مزيّف؟</em>',lead:'غريبان وسؤال واحد. هل الطرف التاني بوت، ولا إنسان عم يمثّل إنو بوت؟',skip:'تخطّي',skipIn:'تخطّي بعد {t}',voteLock:'التصويت بيفتح بعد {t}',offline:'انقطع الاتصال — عم نرجع نتّصل…'}};
const $=s=>document.querySelector(s);
let lang='en';try{lang=localStorage.getItem('bof-lang')||(navigator.language||'').startsWith('ar')&&'ar'||'en'}catch(e){}
const t=(k,v={})=>String(T[lang][k]).replace(/\{(\w)\}/g,(_,x)=>v[x]??'');
let room=null,roomRoundN=0,role=null,mode=null,over=false,online={total:0,det:0,wait:0},lastTyping=0,typT=null;
let stats={dc:0,dt:0,af:0,at:0};try{Object.assign(stats,JSON.parse(localStorage.getItem('bof-stats')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bof-stats',JSON.stringify(stats))}catch(e){}};
const show=k=>{for(const s of ['lobby','wait','game','roomwait'])$('#'+s).hidden=s!==k};

function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>{if(e.dataset.t==='heroH')e.innerHTML=t('heroH');else e.textContent=t(e.dataset.t)});
  $('#lang').textContent=t('langBtn');$('#msg').placeholder=t('ph');
  $('#tips').innerHTML='';for(const x of T[lang].tips){const li=document.createElement('li');li.textContent=x;$('#tips').appendChild(li)}
  renderOnline();renderStats();
  if(mode)$('#who').textContent=whoLabel();
}
function renderOnline(){
  $('#online').textContent=socket.connected?t('online',{n:online.total,d:online.det,w:online.wait}):t('connecting');
  $('#waitCount').textContent=t('waitCount',{d:online.det});
}
function renderStats(){$('#stats').textContent=t('stats',{a:stats.dc,b:stats.dt,c:stats.af,d:stats.at})}
const whoLabel=()=>room?t('roomLbl',{c:room,r:roomRoundN}):mode==='detective'?`${t('subj')} #${$('#who').dataset.n}`:mode==='practice'?t('detAi'):t('detLive');
function addMsg(text,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;$('#log').appendChild(d);$('#log').scrollTop=1e9}
function setTyping(on){$('#typing').textContent=on?t('typing'):''}
function renderSugs(list){
  const box=$('#sugs');box.innerHTML='';
  if(!list){const d=document.createElement('div');d.className='lbl';d.textContent=t('thinking');box.appendChild(d);return}
  for(const s of list){if(typeof s!=='string')continue;const b=document.createElement('button');b.type='button';b.className='sug';b.textContent=s.slice(0,240);b.addEventListener('click',()=>{$('#msg').value=s;$('#msg').focus()});box.appendChild(b)}
}
function showResult(h,p){stopSkip();$('#rH').textContent=h;$('#rP').textContent=p;$('#result').hidden=false;over=true;$('#msg').disabled=true;document.querySelectorAll('.v').forEach(b=>b.disabled=true);renderStats()}

let skipEnd=0,skipT=null;
const fmt=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function skipTick(){const b=$('#skip');if(!b)return;const r=skipEnd-Date.now();const locked=r>0;b.disabled=locked;b.textContent=locked?t('skipIn',{t:fmt(r)}):t('skip');document.querySelectorAll('.v').forEach(v=>v.disabled=locked||over);const h=$('#vlock');if(h)h.textContent=locked?t('voteLock',{t:fmt(r)}):t('hint');if(!locked){clearInterval(skipT);skipT=null}}
function startSkip(){skipEnd=Date.now()+90000;startSkipTick()}
function startSkipTick(){clearInterval(skipT);skipT=setInterval(skipTick,500);skipTick()}
function stopSkip(){skipEnd=0;clearInterval(skipT);skipT=null;const b=$('#skip');if(b){b.disabled=true;b.textContent=''}document.querySelectorAll('.v').forEach(v=>v.disabled=true)}
const socket=io();
socket.on('connect',()=>{$('#off').hidden=true;{const h=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{4}$/.test(h)&&!room){history.replaceState(null,'',location.pathname);socket.emit('joinRoom',h)}}if(role)socket.emit('role',role);if(role==='actor'&&!mode)show('wait');renderOnline()});
socket.on('disconnect',()=>{$('#off').hidden=false;if(mode&&!over){addMsg(t('left'),'sys');over=true;$('#msg').disabled=true}renderOnline()});
socket.on('online',o=>{if(o&&typeof o==='object')online={total:+o.total||0,det:+o.det||0,wait:+o.wait||0};renderOnline()});
socket.on('start',o=>{
  if(o&&o.room){room=String(o.room).slice(0,4);roomRoundN=+o.round||1}
  mode=o&&o.mode;over=false;$('#result').hidden=true;startSkip();$('#log').innerHTML='';setTyping(false);
  $('#who').dataset.n=1000+Math.floor(Math.random()*9000);$('#who').textContent=whoLabel();
  $('#detPanel').hidden=mode!=='detective';$('#actPanel').hidden=mode==='detective';
  $('#msg').disabled=false;$('#msg').value='';
  $('#again').textContent=t(room?'nextRound':'again');$('#again').disabled=false;
  if(mode==='watch'){$('#actPanel').hidden=true;$('#msg').disabled=true;addMsg(t('sysWatch'),'sys')}
  else addMsg(t(room&&mode==='detective'?'sysRoomDet':mode==='detective'?'sysDet':mode==='practice'?'sysPrac':'sysAct'),'sys');
  if(mode==='actor'||mode==='practice')renderSugs(null);
  $('#goDet').disabled=false;show('game');
});
socket.on('msg',o=>{if(!mode||over||!o||typeof o.text!=='string')return;setTyping(false);addMsg(o.text.slice(0,700),'them');if(mode==='actor'||mode==='practice')renderSugs(null)});
socket.on('typing',()=>{if(!mode||over)return;setTyping(true);clearTimeout(typT);typT=setTimeout(()=>setTyping(false),6000)});
socket.on('sugs',l=>{if(mode&&mode!=='detective'&&Array.isArray(l))renderSugs(l)});
socket.on('left',()=>{stopSkip();if(mode&&!over){addMsg(t('left'),'sys');if(mode!=='detective'){over=true;$('#msg').disabled=true}}});
socket.on('result',r=>{
  if(!r)return;
  if(r.kind==='det'){stats.dt++;if(r.ok)stats.dc++;save();
    showResult(t(r.ok?'correct':'fooledYou'),t('youSaid',{v:t(r.vote==='ai'?'vAi':'vHu')})+t(r.truth==='ai'?'tAi':r.mode==='human'?'tHu':'tSim'))}
  else if(r.kind==='watch'){showResult(t(r.ok?'watchOk':'watchNo'),t('watchP',{v:t(r.vote==='ai'?'vAi':'vHu')}))}
  else{stats.at++;if(r.fooled)stats.af++;save();
    showResult(t(r.fooled?'fooled':'busted'),t(r.fooled?'fooledP':'bustedP')+(typeof r.reason==='string'?r.reason.slice(0,240):''))}
});

function startDet(){role='detective';socket.emit('role','detective');$('#goDet').disabled=true;socket.emit('find')}
function goWait(){role='actor';mode=null;socket.emit('role','actor');$('#result').hidden=true;show('wait');renderOnline()}
function toLobby(){role=null;mode=null;socket.emit('leave');socket.emit('role',null);$('#result').hidden=true;show('lobby')}
$('#goDet').addEventListener('click',startDet);
$('#goAct').addEventListener('click',goWait);
$('#waitBack').addEventListener('click',toLobby);
$('#practice').addEventListener('click',()=>socket.emit('practice'));
$('#leave').addEventListener('click',()=>{if(room)return leaveRoom();socket.emit('leave');role==='actor'?goWait():toLobby()});
$('#toLobby').addEventListener('click',()=>room?leaveRoom():toLobby());
$('#again').addEventListener('click',()=>{if(room){socket.emit('nextRound');return}if($('#again').textContent===t('lobby')){$('#result').hidden=true;mode=null;role=null;show('lobby');return}role==='detective'?startDet():goWait()});
socket.on('botmsg',o=>{if(mode==='watch'&&!over&&o&&typeof o.text==='string')addMsg(o.text.slice(0,700),'me')});
socket.on('roomWait',()=>{$('#again').disabled=true;$('#again').textContent=t('waitFriend')});
socket.on('friendReady',()=>{if(!$('#result').hidden)$('#rP').textContent+=' '+t('friendReady')});
socket.on('roomClosed',()=>{room=null;stopSkip();if(!$('#roomwait').hidden){show('lobby');return}showResult(t('left'),t('roomClosed'));$('#again').textContent=t('lobby')});
socket.on('room',o=>{if(!o||typeof o.code!=='string')return;room=o.code.slice(0,4);$('#codeBig').textContent=room;$('#linkTxt').textContent=roomLink();show('roomwait')});
socket.on('roomError',()=>{$('#roomErr').textContent=t('roomErr');show('lobby')});
const roomLink=()=>location.origin+'/#'+room;
function leaveRoom(){socket.emit('leaveRoom');room=null;roomRoundN=0;mode=null;role=null;$('#result').hidden=true;stopSkip();show('lobby')}
$('#mkRoom').addEventListener('click',()=>{$('#roomErr').textContent='';socket.emit('createRoom')});
$('#joinF').addEventListener('submit',e=>{e.preventDefault();const c=$('#code').value.trim().toUpperCase();if(c.length===4){$('#roomErr').textContent='';socket.emit('joinRoom',c)}});
$('#roomBack').addEventListener('click',leaveRoom);
$('#copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(roomLink());$('#copyLink').textContent=t('copied');setTimeout(()=>$('#copyLink').textContent=t('copy'),1500)}catch(e){$('#linkTxt').textContent=roomLink()}});
document.querySelectorAll('.v').forEach(b=>b.addEventListener('click',()=>{if(!over&&mode==='detective')socket.emit('vote',b.dataset.v)}));
socket.on('skipWait',o=>{if(o&&o.ms>0){skipEnd=Date.now()+o.ms;startSkipTick()}});
socket.on('voteWait',o=>{if(o&&o.ms>0){skipEnd=Date.now()+o.ms;startSkipTick()}});
socket.on('skipped',()=>{if(room)return;stopSkip();mode=null;over=true;if(role==='detective')startDet();else goWait()});
$('#skip').addEventListener('click',()=>{if(mode&&!over)socket.emit('skip')});
$('#form').addEventListener('submit',e=>{e.preventDefault();const v=$('#msg').value.trim();if(!v||!mode||over)return;$('#msg').value='';addMsg(v,'me');socket.emit('msg',v.slice(0,600))});
$('#msg').addEventListener('input',()=>{if(mode&&!over&&Date.now()-lastTyping>1500){lastTyping=Date.now();socket.emit('typing')}});
$('#lang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('bof-lang',lang)}catch(e){}applyLang()});
applyLang();
}
</script>
</body>
</html>
